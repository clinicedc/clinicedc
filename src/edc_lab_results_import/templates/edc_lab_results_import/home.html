{% extends edc_base_template %}
{% load static %}

{% block main %}

{{ block.super }}

  <div class="col-sm-4">&nbsp;
  </div>

  <div class="col-sm-4">
    <div class="panel panel-default">
      <div class="panel-heading">Lab results (imported)</div>
      <div class="list-group">
        <a id="home_list_group_home" href="{% url 'home_url' %}" class="list-group-item"><i class="fas fa-reply fa-1x fa-fw" aria-hidden="true"></i> Home</a>
        <a id="home_list_group_dataquery" href="{% url 'edc_lab_results_import:result_search_url' %}" class="list-group-item">Search imported results</a>
        {% if perms.edc_data_manager %}
          <a id="home_edc_data_manager_admin" href="{% url 'edc_lab_results_import_admin:app_list' 'edc_lab_results_import' %}" class="list-group-item">Admin</a>
        {% endif %}
      </div>
    </div>
  </div>

  <div class="col-sm-4">&nbsp;
  </div>
{% endblock main %}
