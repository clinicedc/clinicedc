{% extends 'edc_dashboard/base.html' %}
{% load static %}

{% block main %}

{{ block.super }}

  <div class="col-sm-4">&nbsp;</div>
  <div class="col-sm-4">
    <div class="panel panel-default">
      <div class="panel-heading"><i class="fas fa-flask fa-lg fa-fw"></i> Lab Results</div>
      <div class="list-group">
        <a href="{% url 'home_url' %}" class="list-group-item">
          <i class="fas fa-reply fa-1x fa-fw" aria-hidden="true"></i> Home</a>
        <a href="{% url 'edc_lab_results_import:upload' %}" class="list-group-item">
          <i class="fas fa-upload fa-1x fa-fw" aria-hidden="true"></i> Upload Lab Result PDFs</a>
        <a href="{% url 'edc_lab_results_import:search-imported-results' %}" class="list-group-item">
          <i class="fas fa-search fa-1x fa-fw" aria-hidden="true"></i> Search Imported Results</a>
        <a href="{% url 'edc_lab_results_import:review-imported-results' %}" class="list-group-item">
          <i class="fas fa-clipboard-check fa-1x fa-fw" aria-hidden="true"></i> Review Imported Results
          {% if review_count %}<span class="badge">{{ review_count }}</span>{% endif %}</a>
        <a href="{% url 'edc_lab_results_admin:edc_lab_results_import_result_changelist' %}" class="list-group-item">
          <i class="fas fa-table fa-1x fa-fw" aria-hidden="true"></i> Results</a>
      </div>
    </div>
  </div>
  <div class="col-sm-4">&nbsp;</div>

{% endblock main %}
